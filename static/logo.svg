<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c3f478"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c3f478" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d100e" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0d100e" stroke="#2a322c" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="128" cy="128" r="74" fill="url(#glowGrad)"/>

  <!-- Stream Waves -->
  <path d="M 52 110 C 72 74, 184 74, 204 110" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>

  <!-- Downward Arrow Flow -->
  <g filter="url(#shadow)">
    <rect x="117" y="78" width="22" height="66" rx="6" fill="url(#omniGrad)"/>
    <path d="M 84 136 L 172 136 L 128 180 Z" fill="url(#omniGrad)"/>
  </g>

  <!-- Cradle Arc -->
  <path d="M 68 152 C 88 194, 168 194, 188 152" fill="none" stroke="#c3f478" stroke-width="12" stroke-linecap="round"/>

  <!-- Accent Nodes -->
  <circle cx="70" cy="172" r="7" fill="#38bdf8"/>
  <circle cx="186" cy="172" r="7" fill="#86efac"/>
</svg>
